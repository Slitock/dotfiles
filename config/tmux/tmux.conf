# ~/.config/tmux/tmux.conf
# Цвета (статус-бар, границы, режимы) лежат в ~/.config/tmux/theme.conf —
# он генерируется из палитры DMS, вручную его не правим.

# ── Префикс ──────────────────────────────────────────────────
# По умолчанию C-b. Нужен C-a — раскомментируй три строки ниже.
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ── Основное ─────────────────────────────────────────────────
set -g default-terminal "tmux-256color"     # terminfo с truecolor и italics
set -as terminal-features ",*:RGB"          # truecolor для внешнего терминала
set -g default-shell /usr/bin/fish
set -sg escape-time 0                       # esc без задержки в nvim
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g base-index 1                         # окна с 1
setw -g pane-base-index 1                   # панели с 1
set -g renumber-windows on                  # без дыр после закрытия окна
set -g set-clipboard on                     # OSC 52: копирование в системный буфер
setw -g mode-keys vi
set -g status-position top
set -g status-interval 5
set -g status-justify left

# ── Перезагрузка конфига ─────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; \
       source-file ~/.config/tmux/theme.conf \; \
       display-message "config reloaded"

# ── Сплиты в текущей директории ──────────────────────────────
bind /  split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind c  new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Навигация между панелями ─────────────────────────────────
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ── Ресайз панелей ───────────────────────────────────────────
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-K resize-pane -U 5
bind -n M-J resize-pane -D 5

# ── copy-mode: vi-выделение и копирование в wl-copy ──────────
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ── Цвета из палитры DMS ─────────────────────────────────────
source-file ~/.config/tmux/theme.conf
