# Сгенерировано dank-term-theme из палитры DMS. Правь шаблон:
# ~/.config/dank-term/templates/tmux-theme.conf

# ── Статус-бар ───────────────────────────────────────────────
set -g status-style "fg={{fg}},bg={{surface}}"

set -g status-left-length 34
set -g status-left "#[bg={{accent}},fg={{on_accent}},bold] #S #[bg={{surface}},fg={{accent}}] #[bg={{surface}},fg={{muted}}]#{?client_prefix,PREFIX,} "

set -g status-right-length 70
set -g status-right "#{?window_zoomed_flag,#[fg={{yellow}}]zoom  ,}#[fg={{muted}}]%d.%m #[fg={{border}}]│ #[bg={{accent2}},fg={{on_accent}},bold] %H:%M "

# ── Окна ─────────────────────────────────────────────────────
setw -g window-status-separator ""
setw -g window-status-format "#[fg={{muted}}] #I #[fg={{fg}}]#W#[fg={{yellow}}]#{?window_flags,#{window_flags},} "
setw -g window-status-current-format "#[bg={{accent}},fg={{on_accent}},bold] #I #[bg={{surface_alt}},fg={{fg}},bold] #W #[bg={{surface}},fg={{yellow}}]#{?window_flags,#{window_flags}, }"

# ── Панели ───────────────────────────────────────────────────
set -g pane-border-style "fg={{border}}"
set -g pane-active-border-style "fg={{accent}}"
set -g display-panes-colour "{{muted}}"
set -g display-panes-active-colour "{{accent}}"

# ── Сообщения, режимы, копирование ───────────────────────────
set -g message-style "fg={{fg}},bg={{surface_alt}}"
set -g message-command-style "fg={{fg}},bg={{surface_alt}}"
setw -g mode-style "fg={{on_accent}},bg={{selection}}"
set -g clock-mode-colour "{{accent}}"
set -g clock-mode-style 24
