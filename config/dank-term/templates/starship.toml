# Сгенерировано dank-term-theme из палитры DMS. Правь шаблон:
# ~/.config/dank-term/templates/starship.toml
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
palette = "dank"
scan_timeout = 30
command_timeout = 1000

format = """\
$directory\
$git_branch\
$git_status\
$python\
$cmd_duration\
$fill\
$time\
$line_break\
$character"""

[palettes.dank]
bg = "{{bg}}"
fg = "{{fg}}"
muted = "{{muted}}"
accent = "{{accent}}"
accent2 = "{{accent2}}"
red = "{{red}}"
green = "{{green}}"
yellow = "{{yellow}}"
blue = "{{blue}}"
magenta = "{{magenta}}"
cyan = "{{cyan}}"

[character]
success_symbol = "[❯](bold fg:accent)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"

[directory]
style = "fg:accent"
format = "[$path]($style)"
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "fg:blue"
format = " [ $branch ]($style)"

[git_status]
style = "fg:yellow"
format = "([$all_status$ahead_behind ]($style))"

[python]
symbol = " "
style = "fg:green"
format = "([$symbol$version ]($style))"

[cmd_duration]
min_time = 2000
style = "fg:muted"
format = "[$duration]($style) "

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:muted"
format = "[$time]($style) "
